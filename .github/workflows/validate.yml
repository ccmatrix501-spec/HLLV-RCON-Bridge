name: Validate RCON Bridge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Verify bridge entrypoints
        run: |
          test -f admin_support_entry.py
          test -f rcon_pool_patch.py
          test -f pool_policy.py
          test -f pool_status_api.py
          test -f connection_keeper.py
          test -f app.py
      - name: Smoke test bridge routes without a live game server
        env:
          HLLV_RCON_AUTO_CONNECT: 'false'
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from admin_support_entry import app

          with TestClient(app) as client:
              health = client.get('/health')
              assert health.status_code == 200, health.text
              assert health.json().get('ok') is True

              status = client.get('/api/v2/connection/status')
              assert status.status_code == 200, status.text
              assert status.json().get('connected') is False

              pool = client.get('/api/v2/connection/pool')
              assert pool.status_code == 200, pool.text
              body = pool.json()
              assert 'connected_connections' in body
              assert 'busy_connections' in body
          PY
      - name: Build production Docker image
        run: docker build --pull=false -t hllv-rcon-bridge-ci .
