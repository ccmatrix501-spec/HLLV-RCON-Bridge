name: Validate RCON Bridge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Verify bridge entrypoints
        run: |
          test -f admin_support_entry.py
          test -f rcon_pool_patch.py
          test -f pool_policy.py
          test -f pool_status_api.py
          test -f revive_tracking_patch.py
          test -f bridge_resilience.py
          test -f connection_keeper.py
          test -f app.py
      - name: Verify revive detector compatibility
        env:
          HLLV_RCON_AUTO_CONNECT: 'false'
          PLAYER_STATS_DB_PATH: /tmp/hllv-ci-revive-detector.db
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import revive_tracking_patch as revives

          cases = [
              (SimpleNamespace(weapon_id='REVIVE', instigator_id='0123456789abcdef0123456789abcdef', instigator_name='Medic', raw_message=''), '0123456789abcdef0123456789abcdef'),
              (SimpleNamespace(weapon_id='', raw_message='REVIVE: Medic(Allies/0123456789abcdef0123456789abcdef) -> Trooper(Allies/fedcba9876543210fedcba9876543210)'), '0123456789abcdef0123456789abcdef'),
              (SimpleNamespace(weapon_id='', raw_message='Medic(Axis/0123456789abcdef0123456789abcdef) REVIVED Trooper(Axis/fedcba9876543210fedcba9876543210)'), '0123456789abcdef0123456789abcdef'),
              (SimpleNamespace(weapon_id='', raw_message='Trooper was REVIVED BY Medic(Allies/0123456789abcdef0123456789abcdef)'), '0123456789abcdef0123456789abcdef'),
          ]
          for entry, expected in cases:
              actor = revives._detect_revive_actor(entry)
              assert actor and actor[0] == expected, (entry, actor)

          assert revives._detect_revive_actor(SimpleNamespace(weapon_id='', raw_message='KILL: Player(Allies/0123456789abcdef0123456789abcdef)')) is None
          print('Revive detector compatibility checks passed')
          PY
      - name: Verify critical routes register
        env:
          HLLV_RCON_AUTO_CONNECT: 'false'
          PLAYER_STATS_DB_PATH: /tmp/hllv-ci-player-stats-routes.db
        run: |
          python - <<'PY'
          from admin_support_entry import app
          routes = {(getattr(route, 'path', ''), method) for route in app.routes for method in (getattr(route, 'methods', set()) or set())}
          required = {
              ('/health', 'GET'),
              ('/api/v2/connection/status', 'GET'),
              ('/api/v2/connection/pool', 'GET'),
              ('/api/v2/resilience/status', 'GET'),
              ('/api/v2/revive-tracking/status', 'GET'),
              ('/api/v2/players', 'GET'),
              ('/api/v2/logs', 'GET'),
              ('/api/v2/kick', 'POST'),
              ('/api/v2/temp-ban', 'POST'),
              ('/api/v2/perma-ban', 'POST'),
          }
          missing = sorted(required - routes)
          if missing:
              raise SystemExit(f'Missing production routes: {missing}')
          print(f'Validated {len(routes)} registered route/method pairs')
          PY
      - name: Smoke test production bridge entrypoint without a live game server
        env:
          HLLV_RCON_AUTO_CONNECT: 'false'
          PLAYER_STATS_DB_PATH: /tmp/hllv-ci-player-stats.db
        run: |
          python -m uvicorn admin_support_entry:app --host 127.0.0.1 --port 8080 >/tmp/hllv-rcon.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; cat /tmp/hllv-rcon.log; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/tmp/bridge-health.json; then
              ready=1
              break
            fi
            sleep 0.5
          done
          test "$ready" -eq 1
          grep -q '"ok":true' /tmp/bridge-health.json
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v2/connection/status | grep -q '"connected":false'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v2/connection/pool | grep -q '"connected_connections":0'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v2/resilience/status | grep -q '"ok":true'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v2/revive-tracking/status | grep -q '"ok":true'
      - name: Build production Docker image
        run: docker build --pull=false -t hllv-rcon-bridge-ci .
